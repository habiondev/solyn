version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: solyn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: solyn
      POSTGRES_PASSWORD: solyn
      POSTGRES_DB: solyn
    ports:
      - "5432:5432"
    volumes:
      - solyn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solyn -d solyn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  solyn_pgdata:
